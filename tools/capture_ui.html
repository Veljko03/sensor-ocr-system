<!doctype html><html lang="sr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snimanje ESP fotografija</title>
<style>:root{font:16px Segoe UI,Arial;color-scheme:dark;background:#101820;color:#eef3f9}body{max-width:850px;margin:30px auto;padding:15px}a{color:#92d5f5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;margin:12px 0 6px}input,select,button{font:inherit;background:#233647;color:white;border:1px solid #496579;border-radius:7px;padding:10px;box-sizing:border-box;width:100%}button{width:auto;cursor:pointer;margin:20px 10px 0 0}#start{background:#23754d}#stop{background:#86473e}p{white-space:pre-wrap;color:#bacbd6}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style>
<a href="/">← Nazad na označavanje</a><h1>Snimanje novih slika</h1><p>Snimanje je odvojeno od označavanja. Za nove ESP fotografije server projekta mora da radi i prima upload.</p>
<div class="grid"><div><label>Scenario</label><input id="scenario" value="straight_on"></div><div><label>Grupa (prazno = nova)</label><input id="group"></div><div><label>Skup podataka</label><select id="split"><option value="development">Razvoj</option><option value="validation">Validacija</option><option value="test">Završni test</option></select></div><div><label>Ugao</label><select id="angle"><option>straight</option><option>left</option><option>right</option><option>above</option><option>below</option><option>oblique</option><option>unknown</option></select></div><div><label>Udaljenost</label><select id="distance"><option>medium</option><option>close</option><option>far</option><option>unknown</option></select></div><div><label>Svetlo</label><select id="lighting"><option>normal</option><option>dim</option><option>bright</option><option>glare</option><option>unknown</option></select></div><div><label>Najviše slika u sesiji</label><input id="limit" type="number" min="1" max="5000" value="200"></div><div><label>Najviše MiB ukupno za dataset</label><input id="disk" type="number" min="2" max="2048" value="64"></div></div>
<button id="start">Pokreni snimanje</button><button id="stop">Zaustavi</button><p id="status"></p><p id="message"></p>
<script>const $=id=>document.getElementById(id);let csrf='';async function api(path,data){const response=await fetch(path,data===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Error(result.error);return result}async function status(){const result=await api('/api/status');csrf=result.csrf;const c=result.capture;$('status').textContent=`${c.active?'SNIMANJE UKLJUČENO':'Snimanje isključeno'}\nSačuvano: ${c.saved} · duplikati: ${c.duplicates} · greške: ${c.errors}\n${c.reason}`;$('start').disabled=c.active;$('stop').disabled=!c.active}$('start').onclick=async()=>{try{await api('/api/capture/start',{group_id:$('group').value,scenario:$('scenario').value,split:$('split').value,angle:$('angle').value,distance:$('distance').value,lighting:$('lighting').value,max_images:Number($('limit').value),max_bytes:Number($('disk').value)*1024**2});await status()}catch(e){$('message').textContent=e.message}};$('stop').onclick=async()=>{try{await api('/api/capture/stop',{});await status()}catch(e){$('message').textContent=e.message}};status();setInterval(()=>status().catch(e=>$('message').textContent=e.message),5000);</script></html>
