<!doctype html>
<html lang="sr">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Označi sliku displeja</title>
<style>
*{box-sizing:border-box}:root{font-family:Segoe UI,Arial,sans-serif;color-scheme:dark;background:#101820;color:#eef3f9}body{margin:0;height:100dvh;display:flex;flex-direction:column}header{padding:12px 18px;background:#192632;border-bottom:1px solid #344555;display:flex;gap:10px;flex-wrap:wrap;align-items:center}header strong{font-size:18px}#counts{color:#aec2d1;font-size:13px;margin-left:auto}main{flex:1;min-height:0;width:100%;max-width:1400px;margin:auto;display:flex;flex-direction:column;padding:12px;gap:10px}.viewer{flex:1;min-height:130px;overflow:auto;background:#080d12;border:1px solid #304352;border-radius:9px;display:flex;align-items:center;justify-content:center}#photo{max-width:100%;max-height:100%;object-fit:contain;display:block}#photo.zoomed{max-width:none;max-height:none;align-self:flex-start}.navigation{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.navigation #filename{flex:1;font-size:13px;color:#bacbd6;word-break:break-all}input,button,select{font:inherit;border:1px solid #496579;background:#233647;color:white;border-radius:7px;padding:10px}button{cursor:pointer}button:hover{filter:brightness(1.2)}button:disabled{opacity:.4;cursor:default}#value{font-size:26px;letter-spacing:2px;min-width:0;width:150px;flex:1}#save{background:#23754d}#unreadable{background:#86473e}.label-form{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.label-form button{font-size:16px;min-height:51px}.info{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;color:#a8bac9}.info a{color:#92d5f5}.info label{display:flex;gap:7px;align-items:center}.info input{width:95px;padding:0}#filter{padding:5px;font-size:12px}#status{padding:4px 8px;background:#263c4c;border-radius:5px}#message{min-height:20px;font-size:13px;margin:0}#message.error{color:#ffaaa4}#message.good{color:#9adeb7}#empty{padding:20px;color:#b8c9d5}@media(max-width:450px){header{padding:9px 12px}main{padding:8px;gap:7px}#counts{margin-left:0;width:100%}.label-form button{flex:1}.navigation{gap:6px}.navigation button{padding:7px}.viewer{min-height:180px}.info{gap:6px}}
</style>
<header><strong>Označi sliku displeja</strong><span id="counts">Učitavanje…</span></header>
<main>
<div class="viewer" id="viewer"><img id="photo" alt="Cela originalna fotografija"><span id="empty" hidden>Nema slika.</span></div>
<div class="navigation"><button id="prev" title="Prethodna slika">←</button><span id="position"></span><button id="next" title="Sledeća slika">→</button><span id="filename"></span></div>
<form id="form" class="label-form"><input id="value" aria-label="Vrednost sa displeja" placeholder="npr. 6.62" inputmode="decimal" autocomplete="off"><button id="save" type="submit">Sačuvaj →</button><button id="unreadable" type="button">Nečitljivo →</button></form>
<div class="info"><span id="status">Bez oznake</span><label>Prikaz <select id="filter" aria-label="Prikaz slika"><option value="all">Sve slike</option><option value="pending">Neoznačene</option></select></label><label>Zum <input id="zoom" aria-label="Zum" type="range" min="1" max="4" step=".25" value="1"></label><a href="/capture">Snimanje novih slika</a><a href="/export.csv">CSV</a></div>
<p id="message" role="status" aria-live="polite"></p>
</main>
<script>
const $=id=>document.getElementById(id);let all=[],items=[],index=0,csrf='',busy=false;
function message(text,error=false){$('message').textContent=text;$('message').className=error?'error':'good'}
async function api(path,data){let options={cache:'no-store'};if(data!==undefined)options={...options,method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)};const response=await fetch(path,options),result=await response.json();if(!response.ok)throw Error(result.error||'Zahtev nije uspeo');return result}
function filter(){items=all.filter(row=>$('filter').value==='all'||!row.class||row.class==='skip');index=Math.min(index,Math.max(0,items.length-1))}
function show(){const row=items[index];$('empty').hidden=!!row;$('photo').hidden=!row;$('save').disabled=!row||busy;$('unreadable').disabled=!row||busy;$('prev').disabled=index===0||busy;$('next').disabled=index>=items.length-1||busy;$('position').textContent=items.length?`${index+1} / ${items.length}`:'0 / 0';if(!row){$('filename').textContent='';$('value').value='';$('status').textContent='Bez slike';return}$('photo').src='/image/'+row.id;$('filename').textContent=row.source_filename;$('filename').title=`Grupa: ${row.group_id}\nScenario: ${row.scenario}\nZabeleženo u skupu: ${row.captured_utc}`;$('value').value=row.value||'';$('status').textContent=row.class==='readable'?`Sačuvano: ${row.value}`:(row.class?'Označeno: nečitljivo':'Bez oznake')}
async function status(){const result=await api('/api/status');csrf=result.csrf;$('counts').textContent=`Ukupno ${result.dataset.total} · označeno ${result.dataset.completed} · preostalo ${result.dataset.remaining}`}
async function load(){all=(await api('/api/items')).items;filter();show();await status()}
async function save(type){if(busy||!items.length)return;const row=items[index],value=$('value').value,oldIndex=index;let saved=false;busy=true;$('save').disabled=true;$('unreadable').disabled=true;try{await api('/api/label',{id:row.id,class:type,value,note:type==='unreadable'?'display_presence=unspecified':'',revision:row.revision||0,simple:true});saved=true;message('Sačuvano.');all=(await api('/api/items')).items;filter();index=$('filter').value==='all'?Math.min(oldIndex+1,items.length-1):Math.min(oldIndex,items.length-1);index=Math.max(0,index);await status()}catch(error){message(error.message,true)}finally{busy=false;show();if(!saved)$('value').value=value;$('value').focus()}}
$('form').onsubmit=event=>{event.preventDefault();save('readable')};$('unreadable').onclick=()=>save('unreadable');$('prev').onclick=()=>{if(index>0&&!busy){index--;show()}};$('next').onclick=()=>{if(index<items.length-1&&!busy){index++;show()}};$('filter').onchange=()=>{index=0;filter();show()};$('zoom').oninput=()=>{const ratio=Number($('zoom').value);$('photo').classList.toggle('zoomed',ratio>1);$('photo').style.width=ratio>1?(ratio*100)+'%':''};
document.addEventListener('keydown',event=>{if(event.altKey&&event.key.toLowerCase()==='u'){event.preventDefault();save('unreadable')}if(event.altKey&&event.key==='ArrowLeft'){event.preventDefault();$('prev').click()}if(event.altKey&&event.key==='ArrowRight'){event.preventDefault();$('next').click()}});
load().catch(error=>message(error.message,true));setInterval(()=>status().catch(()=>message('Veza je prekinuta. Sačuvane oznake ostaju dostupne.',true)),5000);
</script></html>
